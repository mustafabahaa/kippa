<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Kippa - Private household finance ledger PWA for USD salary, EGP spending, balances, budget cycles, and reconciliation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kippa</title>
    
    <!-- Theme Detection Script to prevent visual flash -->
    <script>
      (function() {
        try {
          var key = 'finance_theme_mode';
          var pref = localStorage.getItem(key) || 'system';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.add('theme-' + mode);
        } catch (e) {}
      })();
    </script>

    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #f4f5f7;
        color: #131b2e;
      }

      html.theme-dark #splash-screen {
        background: #070908;
        color: #f4f7f2;
      }

      .splash-logo-container {
        width: 80px;
        height: 80px;
        padding: 16px;
        box-sizing: border-box;
        border-radius: 20px;
        border: 1px solid #ecedf0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splashContentIn 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      html.theme-dark .splash-logo-container {
        background: #0e1110;
        border-color: #252b29;
      }

      .splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .splash-brand {
        margin-top: 20px;
        text-align: center;
        animation: splashContentIn 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-title {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.04em;
        margin: 0;
      }

      .splash-subtitle {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.43;
        margin-top: 6px;
        margin-bottom: 0;
      }
      
      html.theme-dark .splash-subtitle {
        color: #9e9bb0;
      }
      html.theme-light .splash-subtitle {
        color: #5f6675;
      }

      .splash-progress-container {
        width: 112px;
        height: 4px;
        margin-top: 24px;
        background: rgba(15, 118, 110, 0.12);
        border-radius: 48px;
        overflow: hidden;
        animation: splashContentIn 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-progress-bar {
        width: 44%;
        height: 100%;
        background-color: #0f766e;
        border-radius: inherit;
        animation: splashProgress 1.25s infinite ease-in-out;
      }

      @keyframes splashContentIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes splashProgress {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo-container,
        .splash-brand,
        .splash-progress-container,
        .splash-progress-bar {
          animation: none;
        }

        .splash-progress-bar {
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static splash screen that matches AppLoadingScreen.tsx -->
      <div id="splash-screen">
        <div class="splash-logo-container">
          <img class="splash-logo" id="splash-logo-img" src="/icons/icon.svg" alt="Kippa Logo" />
        </div>
        <div class="splash-brand">
          <h1 class="splash-title">Kippa</h1>
          <p class="splash-subtitle">Your household ledger</p>
        </div>
        <div class="splash-progress-container">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
      <script>
        // Set correct logo src immediately based on theme preference
        (function() {
          try {
            var mode = document.documentElement.getAttribute('data-theme') || 'light';
            var img = document.getElementById('splash-logo-img');
            if (img) {
              img.src = mode === 'dark' ? '/icons/icon-dark.svg' : '/icons/icon.svg';
            }
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
