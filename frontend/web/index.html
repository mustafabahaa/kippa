<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Kippa - Private household finance ledger PWA for USD salary, EGP spending, balances, budget cycles, and reconciliation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/logo_black_transparent.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/logo_white_transparent.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kippa</title>

    <!-- Theme Detection Script to prevent visual flash -->
    <script>
      (function () {
        try {
          var key = 'finance_theme_mode';
          var pref = localStorage.getItem(key) || 'system';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.add('theme-' + mode);
        } catch (e) {}
      })();
    </script>

    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        z-index: 9999;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #0d0d0d;
      }

      html.theme-dark .splash-screen {
        background: #212121;
        color: #ececec;
      }

      .splash-content {
        display: grid;
        place-items: center;
      }

      .splash-logo {
        display: block;
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: splashLogoPulse 2s ease-in-out infinite;
      }

      @keyframes splashLogoPulse {
        0%,
        100% {
          opacity: 0.94;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static splash screen uses the same markup and styles as AppLoadingScreen.tsx. -->
      <div class="splash-screen" role="status" aria-label="Loading Kippa">
        <div class="splash-content">
          <img class="splash-logo" id="splash-logo-img" src="/icons/logo_black_transparent.png" alt="Kippa" />
        </div>
      </div>
      <script>
        // Set correct logo src immediately based on theme preference
        (function () {
          try {
            var mode = document.documentElement.getAttribute('data-theme') || 'light';
            var img = document.getElementById('splash-logo-img');
            if (img) {
              img.src = mode === 'dark' ? '/icons/logo_white_transparent.png' : '/icons/logo_black_transparent.png';
            }
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
